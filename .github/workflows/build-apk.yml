name: Build APK

on:
  push:
    branches: [main]
    # Personal lessons are fetched by the app at runtime; changing only them needs no new APK.
    paths-ignore:
      - "app/src/main/assets/my_lessons.json"
      - "app/src/main/assets/my_finds.json"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate any missing pronunciation audio (edge-tts)
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install edge-tts
          python tools/gen_audio.py app/src/main/assets/lessons.json app/src/main/assets/audio

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::SIGNING_KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DeutschCards.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeutschCards-apk
          path: DeutschCards.apk

      - name: Move the "latest" tag to this commit
        run: git tag -f latest && git push -f origin latest

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          body: |
            Automatic build of ${{ github.sha }}
            versionCode: ${{ github.run_number }}
          files: DeutschCards.apk
